[project]
name = "libraryapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Vlad Spinul",email = "shinokakaov@mail.ru"}
]
requires-python = ">=3.14, <4.0"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "gunicorn (>=26.1.0,<27.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "python-stdnum (>=2.2,<3.0)",
    "django-filter (>=26.1,<27.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
dev = [
    "coverage (>=7.15.4,<8.0.0)",
    "ipython (>=9.16.1,<10.0.0)"
]

[tool.black]
line-length = 120
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_django = ["django", "rest_framework"]
known_first_party = ["catalog", "lending", "users", "config"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
